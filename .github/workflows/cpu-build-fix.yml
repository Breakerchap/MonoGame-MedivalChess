name: CPU build fix

on:
  push:
    branches:
      - cpu-search-behaviour-fixes

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cpu-search-behaviour-fixes
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Apply build fixes
        run: python tools/fix_cpu_action_generator_build.py
      - name: Restore
        run: dotnet restore CrownAndSiege.sln
      - name: Build
        run: dotnet build CrownAndSiege.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test CrownAndSiege.sln --configuration Release --no-build
      - name: Commit verified build fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MedivalChess.CPU/CpuActionGenerator.cs
          git diff --cached --quiet && exit 0
          git commit -m "Fix CPU purchase clustering build errors"
          git push origin HEAD:cpu-search-behaviour-fixes
