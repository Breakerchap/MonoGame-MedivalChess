name: Unit packs and Circle tests

on:
  push:
    branches: [unit-packs-circle]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet test MedivalChess.Tests/MedivalChess.Tests.csproj -c Release
