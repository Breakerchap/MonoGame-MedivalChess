name: Unit packs and Circle tests

on:
  push:
    branches: [unit-packs-circle]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test MedivalChess.Tests/MedivalChess.Tests.csproj -c Release --logger "console;verbosity=normal" 2>&1 | tee unit-pack-test.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-pack-test-log
          path: unit-pack-test.log
