name: Apply unit ability refactor

on:
  push:
    branches: [unit-packs-circle]
    paths:
      - .github/workflows/apply-unit-ability-refactor.yml
      - tools/apply_unit_ability_refactor.py
      - tools/cleanup_shared_ability_duplicates.py
      - tools/cleanup_shared_ability_duplicates_v2.py
      - tools/apply_shared_royal_abilities.py

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: unit-packs-circle
      - name: Apply checked source transformations
        shell: bash
        run: |
          if [ -f tools/cleanup_shared_ability_duplicates_v2.py ]; then
            sed -i 's/raise RuntimeError(f"Missing end marker for {start_signature}")/return text/' tools/cleanup_shared_ability_duplicates_v2.py
            python3 tools/cleanup_shared_ability_duplicates_v2.py
          fi
          if [ -f tools/apply_shared_royal_abilities.py ]; then
            python3 tools/apply_shared_royal_abilities.py
          fi
      - name: Commit transformed sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply shared Royal ability migration"
          git push origin HEAD:unit-packs-circle
