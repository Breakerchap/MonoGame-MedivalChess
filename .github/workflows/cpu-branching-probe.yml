name: CPU branching probe
on:
  push:
    branches: [cpu-search-behaviour-fixes]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cpu-search-behaviour-fixes
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: python tools/run_cpu_branching_probe.py
      - run: dotnet run --project CpuBranchProbeTemp/CpuBranchProbeTemp.csproj --configuration Release
