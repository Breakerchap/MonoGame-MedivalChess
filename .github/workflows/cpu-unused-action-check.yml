name: CPU unused action check

on:
  push:
    branches:
      - cpu-search-behaviour-fixes

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cpu-search-behaviour-fixes
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Apply unused-action pressure changes
        run: python tools/add_unused_action_pressure.py
      - name: Restore
        run: dotnet restore CrownAndSiege.sln
      - name: Build
        run: dotnet build CrownAndSiege.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test CrownAndSiege.sln --configuration Release --no-build
      - name: Commit verified CPU changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MedivalChess.CPU/Evaluation.cs MedivalChess.CPU/CpuActionCandidates.cs MedivalChess.CPU/CpuSearch.cs MedivalChess.Tests/CpuPlanningEfficiencyTests.cs
          git diff --cached --quiet && exit 0
          git commit -m "Penalize idle CPU units and force available attacks"
          git push origin HEAD:cpu-search-behaviour-fixes
