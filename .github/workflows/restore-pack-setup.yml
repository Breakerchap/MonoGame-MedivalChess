name: Restore pack setup

on:
  push:
    branches: [feature/new-unit-packs]
    paths: [.github/workflows/restore-pack-setup.yml]

permissions:
  contents: write

jobs:
  restore-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/new-unit-packs
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore pack-selection implementation
        shell: bash
        run: |
          set -euo pipefail

          # Reapply the pack-specific files that were removed when the feature branch
          # accidentally inherited the master revert. This preserves all commits/history.
          git checkout a9e8ba2abbc80e5b7a11db4d54e2ddb433a827d7 -- \
            Game1.cs \
            MedivalChess.Shared/CampaignLevelDefinition.cs \
            MedivalChess.Shared/NetworkMessages.cs \
            MedivalChess.Shared/PackRules.cs \
            MedivalChess.Server/MatchHub.cs \
            MedivalChess.CPU/CpuActionGenerator.cs \
            MedivalChess.CPU/CpuArmyPlanner.cs \
            MedivalChess.CPU/CpuGameRules.cs

          python - <<'PY'
          from pathlib import Path

          path = Path('Game1.cs')
          text = path.read_text(encoding='utf-8')

          old = '  private readonly HashSet<Pack> _allowedPacks = [.. PackRules.All];'
          new = '  private readonly HashSet<Pack> _allowedPacks = [Pack.Base];'
          if old not in text:
            raise RuntimeError('Allowed-pack field not found')
          text = text.replace(old, new, 1)

          old = '    _allowedPacks.Clear();\n    _allowedPacks.UnionWith(PackRules.All);\n    SetPlayerCount(2);'
          new = '    _allowedPacks.Clear();\n    _allowedPacks.Add(Pack.Base);\n    SetPlayerCount(2);'
          if old not in text:
            raise RuntimeError('Match setup pack reset not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Build production projects
        run: |
          dotnet build MedivalChess.Shared/MedivalChess.Shared.csproj --configuration Release
          dotnet build MedivalChess.csproj --configuration Release
          dotnet build MedivalChess.Server/MedivalChess.Server.csproj --configuration Release

      - name: Verify default and filtering hooks
        shell: bash
        run: |
          grep -F 'private readonly HashSet<Pack> _allowedPacks = [Pack.Base];' Game1.cs
          grep -F '_allowedPacks.Add(Pack.Base);' Game1.cs
          grep -F 'SetupStage.Packs' Game1.cs
          grep -F 'AllowedPacks' MedivalChess.Shared/NetworkMessages.cs
          grep -F 'PackRules.IsAllowed' MedivalChess.Server/MatchHub.cs
          grep -F 'PackRules.IsAllowed' MedivalChess.CPU/CpuActionGenerator.cs

      - name: Commit tested changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Game1.cs MedivalChess.Shared/CampaignLevelDefinition.cs \
            MedivalChess.Shared/NetworkMessages.cs MedivalChess.Shared/PackRules.cs \
            MedivalChess.Server/MatchHub.cs MedivalChess.CPU/CpuActionGenerator.cs \
            MedivalChess.CPU/CpuArmyPlanner.cs MedivalChess.CPU/CpuGameRules.cs
          git commit -m "feat: choose allowed packs during setup"
          git push origin HEAD:feature/new-unit-packs
