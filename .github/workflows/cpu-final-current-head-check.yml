name: CPU final current-head check

on:
  push:
    branches:
      - cpu-search-behaviour-fixes

permissions:
  contents: write

jobs:
  sync-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cpu-search-behaviour-fixes
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Sync timing tests and comments
        run: python tools/sync_cpu_timing_tests.py
      - name: Restore
        run: dotnet restore CrownAndSiege.sln
      - name: Build
        run: dotnet build CrownAndSiege.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test CrownAndSiege.sln --configuration Release --no-build
      - name: Commit verified sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MedivalChess.CPU/CpuProfiles.cs MedivalChess.Tests/CpuPlayerTests.cs MedivalChess.Tests/CpuAdvancedTests.cs
          git diff --cached --quiet && exit 0
          git commit -m "Sync CPU timing tests with updated budgets"
          git push origin HEAD:cpu-search-behaviour-fixes
