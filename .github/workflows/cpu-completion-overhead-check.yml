name: CPU completion overhead check

on:
  push:
    branches:
      - cpu-search-behaviour-fixes

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cpu-search-behaviour-fixes
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Generate benchmark
        shell: bash
        run: |
          mkdir -p CpuCompletionBenchTemp
          cat > CpuCompletionBenchTemp/CpuCompletionBenchTemp.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net9.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable></PropertyGroup>
            <ItemGroup><ProjectReference Include="../MedivalChess.CPU/MedivalChess.CPU.csproj"/><ProjectReference Include="../MedivalChess.Shared/MedivalChess.Shared.csproj"/></ItemGroup>
          </Project>
          EOF
          cat > CpuCompletionBenchTemp/Program.cs <<'EOF'
          using System.Diagnostics;
          using MedivalChess.CPU;
          using MedivalChess.Shared;
          Globals.ActionLimitsEnabled=false;
          NetworkPiece P(string id,string type,NetworkTeam team,int x,int y){var r=UnitRules.GetRequired(type);return new NetworkPiece(id,type,team,x,y,r.Health);}
          CpuGameState Make(){var c=new NetworkMatchConfiguration("Small","None","None","Regicide",9151,130,0f,0f,2,1,15,FarmsEnabled:false,UnitMaintenanceEnabled:false);return new CpuGameState(c,new[]{P("red-knight","Knight",NetworkTeam.Red,-2,5),P("red-archer","Archer",NetworkTeam.Red,2,5),P("red-soldier","Soldier",NetworkTeam.Red,0,4),P("red-defender","Defender",NetworkTeam.Red,-1,6),P("red-king","King",NetworkTeam.Red,0,8),P("blue-knight","Knight",NetworkTeam.Blue,2,-5),P("blue-archer","Archer",NetworkTeam.Blue,-2,-5),P("blue-soldier","Soldier",NetworkTeam.Blue,0,-4),P("blue-defender","Defender",NetworkTeam.Blue,1,-6),P("blue-king","King",NetworkTeam.Blue,0,-8)},new[]{new CpuTeamState(NetworkTeam.Red,130,MatchRules.ActionsPerTurn),new CpuTeamState(NetworkTeam.Blue,130,MatchRules.ActionsPerTurn)},NetworkTeam.Red,terrain:new BattlefieldTerrain(),scenario:CpuScenarioDefinition.ForMatch(c));}
          for(int i=0;i<3;i++){var sw=Stopwatch.StartNew();var plan=new CpuPlayer().ChooseTurn(Make(),NetworkTeam.Red,CpuProfile.Hard(9151+i),CancellationToken.None);sw.Stop();Console.WriteLine($"BENCH|run={i}|reported={plan.Report.SearchTime.TotalMilliseconds:F0}|wall={sw.Elapsed.TotalMilliseconds:F0}|overhead={sw.Elapsed.TotalMilliseconds-plan.Report.SearchTime.TotalMilliseconds:F0}|actions={plan.Actions.Count}|depth={plan.Report.CompletedSearchDepth}");}
          EOF
      - name: Run benchmark
        run: dotnet run --project CpuCompletionBenchTemp/CpuCompletionBenchTemp.csproj --configuration Release
