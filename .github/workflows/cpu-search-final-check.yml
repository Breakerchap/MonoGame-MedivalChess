name: CPU search final check

on:
  push:
    branches:
      - cpu-search-behaviour-fixes

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cpu-search-behaviour-fixes
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: python tools/fix_iterative_completion.py
      - run: dotnet restore CrownAndSiege.sln
      - run: dotnet test CrownAndSiege.sln --configuration Release --no-restore
      - name: Commit verified timing fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MedivalChess.CPU/CpuSearch.cs
          if ! git diff --cached --quiet; then
            git commit -m "Preserve completed iterative search depths"
            git push origin HEAD:cpu-search-behaviour-fixes
          fi
