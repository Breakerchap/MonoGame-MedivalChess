name: Implement new units and packs

on:
  push:
    branches: [master]
    paths:
      - tools/implement_new_units.py
      - .github/workflows/implement-new-units.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Apply integration patch
        run: python tools/implement_new_units.py
      - name: Test
        run: dotnet test MedivalChess.Tests/MedivalChess.Tests.csproj -c Release
      - name: Commit tested implementation
        run: |
          rm tools/implement_new_units.py
          rm .github/workflows/implement-new-units.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "implement unit packs and new unit movement"
          git push origin HEAD:master
