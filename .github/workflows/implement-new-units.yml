name: Implement new units and packs

on:
  push:
    branches: [master]
    paths:
      - tools/implement_new_units.py
      - .github/workflows/implement-new-units.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Apply integration patch
        run: python tools/implement_new_units.py
      - name: Add movement tuple compatibility
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("MedivalChess.Shared/Piece.cs")
          text = path.read_text(encoding="utf-8")
          old = '''  public static implicit operator MovementDefinition(((int minRange, int maxRange) range, Shape shape) movement) =>
            new(movement.range.minRange, movement.range.maxRange, movement.shape);

          public void Deconstruct'''
          # Match without relying on indentation inside this YAML block.
          old = old.replace("          new(", "    new(").replace("          public", "  public")
          new = '''  public static implicit operator MovementDefinition(((int minRange, int maxRange) range, Shape shape) movement) =>
            new(movement.range.minRange, movement.range.maxRange, movement.shape);

          public static implicit operator (int range, Shape shape)(MovementDefinition movement) =>
            (movement.Maximum, movement.Shape);

          public void Deconstruct'''
          new = new.replace("          new(", "    new(").replace("          public", "  public").replace("          (movement", "    (movement")
          if old not in text:
            raise RuntimeError("MovementDefinition compatibility insertion point was not found.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY
      - name: Test
        run: dotnet test MedivalChess.Tests/MedivalChess.Tests.csproj -c Release
      - name: Commit tested implementation
        run: |
          rm tools/implement_new_units.py
          rm .github/workflows/implement-new-units.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "implement unit packs and new unit movement"
          git push origin HEAD:master
