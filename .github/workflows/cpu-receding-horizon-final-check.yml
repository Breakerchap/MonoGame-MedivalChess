name: CPU receding horizon final check

on:
  push:
    branches:
      - cpu-search-behaviour-fixes

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cpu-search-behaviour-fixes
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Apply final timing fixes
        run: python tools/fix_receding_horizon_deadlines.py
      - name: Restore
        run: dotnet restore CrownAndSiege.sln
      - name: Test
        run: dotnet test CrownAndSiege.sln --configuration Release --no-restore
      - name: Commit verified timing fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MedivalChess.CPU/CpuSearch.cs MedivalChess.CPU/CpuActionGenerator.cs
          git diff --cached --quiet && exit 0
          git commit -m "Tighten CPU receding-horizon timing"
          git push origin HEAD:cpu-search-behaviour-fixes
