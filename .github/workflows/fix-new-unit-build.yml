name: Fix new-unit build

on:
  push:
    branches:
      - feature/new-unit-packs

permissions:
  contents: write

jobs:
  fix-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/new-unit-packs
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Repair PieceDefinition compatibility
        shell: python
        run: |
          from pathlib import Path

          path = Path('MedivalChess.Shared/Piece.cs')
          text = path.read_text(encoding='utf-8')

          if 'public enum PieceCategory' not in text:
            marker = 'public enum Pack\n{\n'
            categories = '''public enum PieceCategory
          {
            Melee,
            Ranged,
            Intelligence,
            Mechanical,
            Structure,
            Transport,
            Royal
          }

          '''
            assert marker in text, 'Pack marker not found'
            text = text.replace(marker, categories + marker, 1)

          if 'public readonly record struct MovementDefinition' not in text:
            marker = '/// <summary>Authoritative game-facing unit definition. All unit stats are declared in <see cref="PieceDefinitions"/>.</summary>\n'
            movement = '''/// <summary>Inclusive movement range plus movement geometry, with compatibility for legacy scalar movement callers.</summary>
          public readonly record struct MovementDefinition
          {
            public int Minimum { get; }
            public int Maximum { get; }
            public Shape Shape { get; }

            // Legacy callers treat movement as a maximum range plus shape.
            public int range => Maximum;
            public Shape shape => Shape;

            public MovementDefinition(int minimum, int maximum, Shape shape)
            {
              if (minimum < 0)
                throw new ArgumentOutOfRangeException(nameof(minimum), "Movement range cannot be negative.");
              if (maximum < minimum)
                throw new ArgumentOutOfRangeException(nameof(maximum), "Movement maximum must be at least its minimum.");

              Minimum = minimum;
              Maximum = maximum;
              Shape = shape;
            }

            public static implicit operator MovementDefinition(
              ((int minRange, int maxRange) range, Shape shape) movement) =>
              new(movement.range.minRange, movement.range.maxRange, movement.shape);

            public static implicit operator MovementDefinition((int range, Shape shape) movement) =>
              new(movement.range == 0 ? 0 : 1, movement.range, movement.shape);

            public static implicit operator (int range, Shape shape)(MovementDefinition movement) =>
              (movement.Maximum, movement.Shape);
          }

          '''
            assert marker in text, 'PieceDefinition summary marker not found'
            text = text.replace(marker, movement + marker, 1)

          old_prop = '  public Pack Pack { get; }\n\n  public ((int minRange, int maxRange), Shape shape) Movement { get; }\n'
          new_prop = '  public PieceCategory Category { get; }\n\n  public Pack Pack { get; }\n\n  public MovementDefinition Movement { get; }\n'
          if old_prop in text:
            text = text.replace(old_prop, new_prop, 1)
          else:
            assert 'public PieceCategory Category { get; }' in text and 'public MovementDefinition Movement { get; }' in text, 'PieceDefinition properties not patched'

          old_param = '    ((int minRange, int maxRange), Shape shape) movement,\n'
          if old_param in text:
            text = text.replace(old_param, '    MovementDefinition movement,\n', 1)
          else:
            assert '    MovementDefinition movement,\n' in text, 'Movement constructor parameter not patched'

          old_assign = '    Pack = pack;\n    Movement = movement;\n'
          if old_assign in text:
            text = text.replace(old_assign, '    Category = GetDefaultCategory(type);\n    Pack = pack;\n    Movement = movement;\n', 1)
          else:
            assert 'Category = GetDefaultCategory(type);' in text, 'Category assignment not patched'

          if 'GetDefaultCategory(PieceType type)' not in text:
            marker = '    AbilityDescription = abilityDescription;\n  }\n}\n\n/// <summary>\n/// The single source of truth'
            replacement = '''    AbilityDescription = abilityDescription;
            }

            private static PieceCategory GetDefaultCategory(PieceType type) => type switch
            {
              PieceType.Archer or PieceType.Crossbowman or PieceType.Bombard or
              PieceType.Wizard or PieceType.Dragon => PieceCategory.Ranged,

              PieceType.Cannon or PieceType.Catapult or PieceType.Ballista => PieceCategory.Mechanical,
              PieceType.Spy or PieceType.Engineer => PieceCategory.Intelligence,
              PieceType.Farm => PieceCategory.Structure,
              PieceType.Ox => PieceCategory.Transport,

              PieceType.King or PieceType.Princess or PieceType.Palace or PieceType.Baron or PieceType.Emissary or
              PieceType.Emperor or PieceType.TerracottaWarrior or PieceType.GoblinRoyalty or PieceType.Phantom or
              PieceType.Zeus or PieceType.ChessKing => PieceCategory.Royal,

              _ => PieceCategory.Melee
            };
          }

          /// <summary>
          /// The single source of truth'''
            assert marker in text, 'PieceDefinition constructor end marker not found'
            text = text.replace(marker, replacement, 1)

          path.write_text(text, encoding='utf-8')

      - name: Update resolver for pack-aware PieceDefinition
        shell: python
        run: |
          from pathlib import Path

          path = Path('MedivalChess.Shared/CampaignUnitResolver.cs')
          text = path.read_text(encoding='utf-8')

          old = '''        new PieceDefinition(nativeAbilitySource.Type, native.Category, native.Movement, native.Attack, native.Health, native.Size,
                    native.AttackRange, native.AttackPattern, native.Cost, nativeAbilitySource.AbilityDescription, native.Identifier, template.Name, template.Abbreviation),'''
          new = '''        new PieceDefinition(nativeAbilitySource.Type, template.Abbreviation ?? native.Abbreviation ?? string.Empty, native.Pack, native.Movement, native.Attack, native.Health, native.Size,
                    native.AttackRange, native.AttackPattern, native.Cost, nativeAbilitySource.AbilityDescription, native.Identifier, template.Name),'''
          if old in text:
            text = text.replace(old, new, 1)

          old = '''        abilitySource.Type,
                  baseDefinition.Category,
                  baseDefinition.Movement,'''
          new = '''        abilitySource.Type,
                  custom.Abbreviation ?? baseDefinition.Abbreviation ?? string.Empty,
                  baseDefinition.Pack,
                  baseDefinition.Movement,'''
          if old in text:
            text = text.replace(old, new, 1)

          old = '''        custom.Name,
                  custom.Abbreviation
                ),'''
          if old in text:
            text = text.replace(old, '''        custom.Name
                ),''', 1)

          old = '''      definition = new PieceDefinition(
                source.Type,
                source.Category,
                (overrides?.MoveRange ?? source.Movement.range, overrides?.MovePattern ?? source.Movement.shape),
                overrides?.Attack ?? source.Attack,
                overrides?.Health ?? source.Health,
                (overrides?.Width ?? source.Size.x, overrides?.Height ?? source.Size.y),
                new AttackRange(minimumAttackRange, maximumAttackRange),
                overrides?.AttackPattern ?? source.AttackPattern,
                overrides?.Cost ?? source.Cost,
                abilityDescription,
                identifier,
                displayName,
                abbreviation
              );'''
          new = '''      int maximumMoveRange = overrides?.MoveRange ?? source.Movement.Maximum;
              int minimumMoveRange = Math.Min(source.Movement.Minimum, maximumMoveRange);
              definition = new PieceDefinition(
                source.Type,
                abbreviation ?? source.Abbreviation ?? string.Empty,
                source.Pack,
                new MovementDefinition(minimumMoveRange, maximumMoveRange, overrides?.MovePattern ?? source.Movement.Shape),
                overrides?.Attack ?? source.Attack,
                overrides?.Health ?? source.Health,
                (overrides?.Width ?? source.Size.x, overrides?.Height ?? source.Size.y),
                new AttackRange(minimumAttackRange, maximumAttackRange),
                overrides?.AttackPattern ?? source.AttackPattern,
                overrides?.Cost ?? source.Cost,
                abilityDescription,
                identifier,
                displayName
              );'''
          assert old in text or 'new MovementDefinition(minimumMoveRange, maximumMoveRange' in text, 'TryApplyOverrides block not found'
          if old in text:
            text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Update shared unit rules for new shapes
        shell: python
        run: |
          from pathlib import Path

          path = Path('MedivalChess.Shared/UnitRules.cs')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
          '''  Line,
            Forward,''',
          '''  Line,
            Diagonal,
            LineOrDiagonal,
            ChessKnight,
            Forward,''', 1)
          text = text.replace(
          '''  ForwardOrForwardDiagonal,
            PierceStraight,''',
          '''  ForwardOrForwardDiagonal,
            ForwardLine,
            PierceStraight,''', 1)

          text = text.replace(
          '''    Shape.Line => RuleShape.Line,
              Shape.Forward => RuleShape.Forward,''',
          '''    Shape.Line => RuleShape.Line,
              Shape.Diagonal => RuleShape.Diagonal,
              Shape.LineOrDiagonal => RuleShape.LineOrDiagonal,
              Shape.ChessKnight => RuleShape.ChessKnight,
              Shape.Forward => RuleShape.Forward,''')
          text = text.replace(
          '''    Shape.ForwardOrForwardDiagonal => RuleShape.ForwardOrForwardDiagonal,
              Shape.PierceStraight => RuleShape.PierceStraight,''',
          '''    Shape.ForwardOrForwardDiagonal => RuleShape.ForwardOrForwardDiagonal,
              Shape.ForwardLine => RuleShape.ForwardLine,
              Shape.PierceStraight => RuleShape.PierceStraight,''')

          text = text.replace(
          '''      RuleShape.Line => (dx == 0 || dy == 0) && chessboardDistance <= rule.MoveRange,
                RuleShape.Any => chessboardDistance <= rule.MoveRange,''',
          '''      RuleShape.Line => (dx == 0 || dy == 0) && chessboardDistance <= rule.MoveRange,
                RuleShape.Diagonal => dx == dy && chessboardDistance <= rule.MoveRange,
                RuleShape.LineOrDiagonal => (dx == 0 || dy == 0 || dx == dy) && chessboardDistance <= rule.MoveRange,
                RuleShape.ChessKnight => ((dx == 1 && dy == 2) || (dx == 2 && dy == 1)) && chessboardDistance <= rule.MoveRange,
                RuleShape.Any => chessboardDistance <= rule.MoveRange,''')

          text = text.replace(
          '''      RuleShape.Line or RuleShape.PierceStraight => dx == 0 || dy == 0,
                RuleShape.Forward => IsForwardOffset(team, dx, dy, distance),''',
          '''      RuleShape.Line or RuleShape.PierceStraight => dx == 0 || dy == 0,
                RuleShape.Diagonal => Math.Abs(dx) == Math.Abs(dy),
                RuleShape.LineOrDiagonal => dx == 0 || dy == 0 || Math.Abs(dx) == Math.Abs(dy),
                RuleShape.ChessKnight => (Math.Abs(dx) == 1 && Math.Abs(dy) == 2) || (Math.Abs(dx) == 2 && Math.Abs(dy) == 1),
                RuleShape.Forward => IsForwardOffset(team, dx, dy, distance),
                RuleShape.ForwardLine => IsForwardOffset(team, dx, dy, distance),''')

          path.write_text(text, encoding='utf-8')

      - name: Build production projects
        run: |
          dotnet build MedivalChess.Shared/MedivalChess.Shared.csproj --configuration Release
          dotnet build MedivalChess.csproj --configuration Release
          dotnet build MedivalChess.Server/MedivalChess.Server.csproj --configuration Release

      - name: Commit build fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MedivalChess.Shared/Piece.cs MedivalChess.Shared/CampaignUnitResolver.cs MedivalChess.Shared/UnitRules.cs
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "fix: restore unit definition compatibility"
            git push origin HEAD:feature/new-unit-packs
          fi
