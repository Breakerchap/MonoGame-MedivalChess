name: Fix new-unit build

on:
  push:
    branches:
      - feature/new-unit-packs

permissions:
  contents: write

jobs:
  fix-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/new-unit-packs
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Repair PieceDefinition compatibility
        shell: python
        run: |
          from pathlib import Path

          path = Path('MedivalChess.Shared/Piece.cs')
          text = path.read_text(encoding='utf-8')

          pack_marker = '''public enum Pack
          {
          '''
          if 'public enum PieceCategory' not in text:
            categories = '''public enum PieceCategory
          {
            Melee,
            Ranged,
            Intelligence,
            Mechanical,
            Structure,
            Transport,
            Royal
          }

          '''
            text = text.replace(pack_marker, categories + pack_marker, 1)

          old_props = '''  public Pack Pack { get; }

            public ((int minRange, int maxRange), Shape shape) Movement { get; }
          '''
          new_props = '''  public PieceCategory Category { get; }

            public Pack Pack { get; }

            public ((int minRange, int maxRange), Shape shape) Movement { get; }
          '''
          text = text.replace(old_props, new_props, 1)

          old_assign = '''    Pack = pack;
            Movement = movement;
          '''
          new_assign = '''    Category = GetDefaultCategory(type);
            Pack = pack;
            Movement = movement;
          '''
          text = text.replace(old_assign, new_assign, 1)

          ctor_end = '''    AbilityDescription = abilityDescription;
            }
          }
          '''
          if 'GetDefaultCategory(PieceType type)' not in text:
            helper = '''    AbilityDescription = abilityDescription;
            }

            private static PieceCategory GetDefaultCategory(PieceType type) => type switch
            {
              PieceType.Archer or PieceType.Crossbowman or PieceType.Bombard or
              PieceType.Wizard or PieceType.Dragon => PieceCategory.Ranged,

              PieceType.Cannon or PieceType.Catapult or PieceType.Ballista => PieceCategory.Mechanical,

              PieceType.Spy or PieceType.Engineer => PieceCategory.Intelligence,

              PieceType.Farm => PieceCategory.Structure,
              PieceType.Ox => PieceCategory.Transport,

              PieceType.King or PieceType.Princess or PieceType.Palace or PieceType.Baron or PieceType.Emissary or
              PieceType.Emperor or PieceType.TerracottaWarrior or PieceType.GoblinRoyalty or PieceType.Phantom or
              PieceType.Zeus or PieceType.ChessKing => PieceCategory.Royal,

              _ => PieceCategory.Melee
            };
          }
          '''
            text = text.replace(ctor_end, helper, 1)

          path.write_text(text, encoding='utf-8')

      - name: Update resolver for pack-aware PieceDefinition
        shell: python
        run: |
          from pathlib import Path

          path = Path('MedivalChess.Shared/CampaignUnitResolver.cs')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
          '''        new PieceDefinition(nativeAbilitySource.Type, native.Category, native.Movement, native.Attack, native.Health, native.Size,
                    native.AttackRange, native.AttackPattern, native.Cost, nativeAbilitySource.AbilityDescription, native.Identifier, template.Name, template.Abbreviation),''',
          '''        new PieceDefinition(nativeAbilitySource.Type, template.Abbreviation ?? native.Abbreviation ?? string.Empty, native.Pack, native.Movement, native.Attack, native.Health, native.Size,
                    native.AttackRange, native.AttackPattern, native.Cost, nativeAbilitySource.AbilityDescription, native.Identifier, template.Name),''')

          text = text.replace(
          '''        abilitySource.Type,
                  baseDefinition.Category,
                  baseDefinition.Movement,''',
          '''        abilitySource.Type,
                  custom.Abbreviation ?? baseDefinition.Abbreviation ?? string.Empty,
                  baseDefinition.Pack,
                  baseDefinition.Movement,''')

          text = text.replace(
          '''        custom.Name,
                  custom.Abbreviation
                ),''',
          '''        custom.Name
                ),''')

          old = '''      definition = new PieceDefinition(
                source.Type,
                source.Category,
                (overrides?.MoveRange ?? source.Movement.range, overrides?.MovePattern ?? source.Movement.shape),
                overrides?.Attack ?? source.Attack,
                overrides?.Health ?? source.Health,
                (overrides?.Width ?? source.Size.x, overrides?.Height ?? source.Size.y),
                new AttackRange(minimumAttackRange, maximumAttackRange),
                overrides?.AttackPattern ?? source.AttackPattern,
                overrides?.Cost ?? source.Cost,
                abilityDescription,
                identifier,
                displayName,
                abbreviation
              );'''
          new = '''      int maximumMoveRange = overrides?.MoveRange ?? source.Movement.Item1.maxRange;
              int minimumMoveRange = Math.Min(source.Movement.Item1.minRange, maximumMoveRange);
              definition = new PieceDefinition(
                source.Type,
                abbreviation ?? source.Abbreviation ?? string.Empty,
                source.Pack,
                ((minimumMoveRange, maximumMoveRange), overrides?.MovePattern ?? source.Movement.shape),
                overrides?.Attack ?? source.Attack,
                overrides?.Health ?? source.Health,
                (overrides?.Width ?? source.Size.x, overrides?.Height ?? source.Size.y),
                new AttackRange(minimumAttackRange, maximumAttackRange),
                overrides?.AttackPattern ?? source.AttackPattern,
                overrides?.Cost ?? source.Cost,
                abilityDescription,
                identifier,
                displayName
              );'''
          text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')

      - name: Update shared unit rules for movement ranges and new shapes
        shell: python
        run: |
          from pathlib import Path

          path = Path('MedivalChess.Shared/UnitRules.cs')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
          '''  Line,
            Forward,''',
          '''  Line,
            Diagonal,
            LineOrDiagonal,
            ChessKnight,
            Forward,''', 1)
          text = text.replace(
          '''  ForwardOrForwardDiagonal,
            PierceStraight,''',
          '''  ForwardOrForwardDiagonal,
            ForwardLine,
            PierceStraight,''', 1)

          text = text.replace('definition.Movement.range,', 'definition.Movement.Item1.maxRange,')

          text = text.replace(
          '''    Shape.Line => RuleShape.Line,
              Shape.Forward => RuleShape.Forward,''',
          '''    Shape.Line => RuleShape.Line,
              Shape.Diagonal => RuleShape.Diagonal,
              Shape.LineOrDiagonal => RuleShape.LineOrDiagonal,
              Shape.ChessKnight => RuleShape.ChessKnight,
              Shape.Forward => RuleShape.Forward,''')
          text = text.replace(
          '''    Shape.ForwardOrForwardDiagonal => RuleShape.ForwardOrForwardDiagonal,
              Shape.PierceStraight => RuleShape.PierceStraight,''',
          '''    Shape.ForwardOrForwardDiagonal => RuleShape.ForwardOrForwardDiagonal,
              Shape.ForwardLine => RuleShape.ForwardLine,
              Shape.PierceStraight => RuleShape.PierceStraight,''')

          text = text.replace(
          '''      RuleShape.Line => (dx == 0 || dy == 0) && chessboardDistance <= rule.MoveRange,
                RuleShape.Any => chessboardDistance <= rule.MoveRange,''',
          '''      RuleShape.Line => (dx == 0 || dy == 0) && chessboardDistance <= rule.MoveRange,
                RuleShape.Diagonal => dx == dy && chessboardDistance <= rule.MoveRange,
                RuleShape.LineOrDiagonal => (dx == 0 || dy == 0 || dx == dy) && chessboardDistance <= rule.MoveRange,
                RuleShape.ChessKnight => ((dx == 1 && dy == 2) || (dx == 2 && dy == 1)) && chessboardDistance <= rule.MoveRange,
                RuleShape.Any => chessboardDistance <= rule.MoveRange,''')

          text = text.replace(
          '''      RuleShape.Line or RuleShape.PierceStraight => dx == 0 || dy == 0,
                RuleShape.Forward => IsForwardOffset(team, dx, dy, distance),''',
          '''      RuleShape.Line or RuleShape.PierceStraight => dx == 0 || dy == 0,
                RuleShape.Diagonal => Math.Abs(dx) == Math.Abs(dy),
                RuleShape.LineOrDiagonal => dx == 0 || dy == 0 || Math.Abs(dx) == Math.Abs(dy),
                RuleShape.ChessKnight => (Math.Abs(dx) == 1 && Math.Abs(dy) == 2) || (Math.Abs(dx) == 2 && Math.Abs(dy) == 1),
                RuleShape.Forward => IsForwardOffset(team, dx, dy, distance),
                RuleShape.ForwardLine => IsForwardOffset(team, dx, dy, distance),''')

          path.write_text(text, encoding='utf-8')

      - name: Build production projects
        run: |
          dotnet build MedivalChess.Shared/MedivalChess.Shared.csproj --configuration Release
          dotnet build MedivalChess.csproj --configuration Release
          dotnet build MedivalChess.Server/MedivalChess.Server.csproj --configuration Release

      - name: Commit build fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MedivalChess.Shared/Piece.cs MedivalChess.Shared/CampaignUnitResolver.cs MedivalChess.Shared/UnitRules.cs
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "fix: restore unit definition compatibility"
            git push origin HEAD:feature/new-unit-packs
          fi
