name: Fix new-unit build

on:
  push:
    branches: [feature/new-unit-packs]

permissions:
  contents: write

jobs:
  fix-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/new-unit-packs
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Repair unit model compatibility
        shell: python
        run: |
          from pathlib import Path

          piece_path = Path('MedivalChess.Shared/Piece.cs')
          p = piece_path.read_text(encoding='utf-8')

          if 'public enum PieceCategory' not in p:
            p = p.replace('public enum Pack\n{\n', '''public enum PieceCategory
          {
            Melee, Ranged, Intelligence,
            Mechanical, Structure, Transport,
            Royal
          }

          public enum Pack
          {
          ''', 1)

          if 'public readonly record struct MovementDefinition' not in p:
            marker = '/// <summary>Authoritative game-facing unit definition. All unit stats are declared in <see cref="PieceDefinitions"/>.</summary>\n'
            movement = '''/// <summary>Movement distance and geometry, retaining the old maximum-range tuple API for existing callers.</summary>
          public readonly record struct MovementDefinition
          {
            public int Minimum { get; }
            public int Maximum { get; }
            public Shape Shape { get; }
            public int range => Maximum;
            public Shape shape => Shape;

            public MovementDefinition(int minimum, int maximum, Shape shape)
            {
              if (minimum < 0) throw new ArgumentOutOfRangeException(nameof(minimum));
              if (maximum < minimum) throw new ArgumentOutOfRangeException(nameof(maximum));
              Minimum = minimum;
              Maximum = maximum;
              Shape = shape;
            }

            public static implicit operator MovementDefinition(((int minRange, int maxRange) range, Shape shape) value) =>
              new(value.range.minRange, value.range.maxRange, value.shape);
            public static implicit operator MovementDefinition((int range, Shape shape) value) =>
              new(value.range == 0 ? 0 : 1, value.range, value.shape);
            public static implicit operator (int range, Shape shape)(MovementDefinition value) =>
              (value.Maximum, value.Shape);
          }

          '''
            assert marker in p
            p = p.replace(marker, movement + marker, 1)

          p = p.replace(
            '  public Pack Pack { get; }\n\n  public ((int minRange, int maxRange), Shape shape) Movement { get; }\n',
            '  public PieceCategory Category { get; }\n\n  public Pack Pack { get; }\n\n  public MovementDefinition Movement { get; }\n', 1)
          p = p.replace('    ((int minRange, int maxRange), Shape shape) movement,\n', '    MovementDefinition movement,\n', 1)
          p = p.replace('    Pack = pack;\n    Movement = movement;\n', '    Category = GetDefaultCategory(type);\n    Pack = pack;\n    Movement = movement;\n', 1)

          if 'GetDefaultCategory(PieceType type)' not in p:
            end = '    AbilityDescription = abilityDescription;\n  }\n}\n\n/// <summary>\n/// The single source of truth'
            repl = '''    AbilityDescription = abilityDescription;
            }

            private static PieceCategory GetDefaultCategory(PieceType type) => type switch
            {
              PieceType.Archer or PieceType.Crossbowman or PieceType.Bombard or PieceType.Wizard or PieceType.Dragon => PieceCategory.Ranged,
              PieceType.Cannon or PieceType.Catapult or PieceType.Ballista => PieceCategory.Mechanical,
              PieceType.Spy or PieceType.Engineer => PieceCategory.Intelligence,
              PieceType.Farm => PieceCategory.Structure,
              PieceType.Ox => PieceCategory.Transport,
              PieceType.King or PieceType.Princess or PieceType.Palace or PieceType.Baron or PieceType.Emissary or
              PieceType.Emperor or PieceType.TerracottaWarrior or PieceType.GoblinRoyalty or PieceType.Phantom or PieceType.Zeus or PieceType.ChessKing => PieceCategory.Royal,
              _ => PieceCategory.Melee
            };
          }

          /// <summary>
          /// The single source of truth'''
            assert end in p
            p = p.replace(end, repl, 1)

          assert 'public MovementDefinition Movement' in p
          assert 'public PieceCategory Category' in p
          piece_path.write_text(p, encoding='utf-8')

          resolver_path = Path('MedivalChess.Shared/CampaignUnitResolver.cs')
          r = resolver_path.read_text(encoding='utf-8')
          r = r.replace(
            'new PieceDefinition(nativeAbilitySource.Type, native.Category, native.Movement, native.Attack, native.Health, native.Size,\n          native.AttackRange, native.AttackPattern, native.Cost, nativeAbilitySource.AbilityDescription, native.Identifier, template.Name, template.Abbreviation)',
            'new PieceDefinition(nativeAbilitySource.Type, template.Abbreviation ?? native.Abbreviation ?? string.Empty, native.Pack, native.Movement, native.Attack, native.Health, native.Size,\n          native.AttackRange, native.AttackPattern, native.Cost, nativeAbilitySource.AbilityDescription, native.Identifier, template.Name)', 1)
          r = r.replace(
            '        abilitySource.Type,\n        baseDefinition.Category,\n        baseDefinition.Movement,',
            '        abilitySource.Type,\n        custom.Abbreviation ?? baseDefinition.Abbreviation ?? string.Empty,\n        baseDefinition.Pack,\n        baseDefinition.Movement,', 1)
          r = r.replace('        custom.Name,\n        custom.Abbreviation\n      ),', '        custom.Name\n      ),', 1)

          method = r.index('  private static bool TryApplyOverrides(')
          start = r.index('      definition = new PieceDefinition(', method)
          finish = r.index('      return true;', start)
          replacement = '''      int maximumMoveRange = overrides?.MoveRange ?? source.Movement.Maximum;
                int minimumMoveRange = Math.Min(source.Movement.Minimum, maximumMoveRange);
                definition = new PieceDefinition(
                  source.Type,
                  abbreviation ?? source.Abbreviation ?? string.Empty,
                  source.Pack,
                  new MovementDefinition(minimumMoveRange, maximumMoveRange, overrides?.MovePattern ?? source.Movement.Shape),
                  overrides?.Attack ?? source.Attack,
                  overrides?.Health ?? source.Health,
                  (overrides?.Width ?? source.Size.x, overrides?.Height ?? source.Size.y),
                  new AttackRange(minimumAttackRange, maximumAttackRange),
                  overrides?.AttackPattern ?? source.AttackPattern,
                  overrides?.Cost ?? source.Cost,
                  abilityDescription,
                  identifier,
                  displayName
                );
          '''
          r = r[:start] + replacement + r[finish:]
          resolver_path.write_text(r, encoding='utf-8')

          rules_path = Path('MedivalChess.Shared/UnitRules.cs')
          u = rules_path.read_text(encoding='utf-8')
          u = u.replace('  Line,\n  Forward,', '  Line,\n  Diagonal,\n  LineOrDiagonal,\n  ChessKnight,\n  Forward,', 1)
          u = u.replace('  ForwardOrForwardDiagonal,\n  PierceStraight,', '  ForwardOrForwardDiagonal,\n  ForwardLine,\n  PierceStraight,', 1)
          u = u.replace('    Shape.Line => RuleShape.Line,\n    Shape.Forward => RuleShape.Forward,', '    Shape.Line => RuleShape.Line,\n    Shape.Diagonal => RuleShape.Diagonal,\n    Shape.LineOrDiagonal => RuleShape.LineOrDiagonal,\n    Shape.ChessKnight => RuleShape.ChessKnight,\n    Shape.Forward => RuleShape.Forward,', 1)
          u = u.replace('    Shape.ForwardOrForwardDiagonal => RuleShape.ForwardOrForwardDiagonal,\n    Shape.PierceStraight => RuleShape.PierceStraight,', '    Shape.ForwardOrForwardDiagonal => RuleShape.ForwardOrForwardDiagonal,\n    Shape.ForwardLine => RuleShape.ForwardLine,\n    Shape.PierceStraight => RuleShape.PierceStraight,', 1)
          u = u.replace('      RuleShape.Line => (dx == 0 || dy == 0) && chessboardDistance <= rule.MoveRange,\n      RuleShape.Any => chessboardDistance <= rule.MoveRange,', '      RuleShape.Line => (dx == 0 || dy == 0) && chessboardDistance <= rule.MoveRange,\n      RuleShape.Diagonal => dx == dy && chessboardDistance <= rule.MoveRange,\n      RuleShape.LineOrDiagonal => (dx == 0 || dy == 0 || dx == dy) && chessboardDistance <= rule.MoveRange,\n      RuleShape.ChessKnight => ((dx == 1 && dy == 2) || (dx == 2 && dy == 1)) && chessboardDistance <= rule.MoveRange,\n      RuleShape.Any => chessboardDistance <= rule.MoveRange,', 1)
          u = u.replace('      RuleShape.Line or RuleShape.PierceStraight => dx == 0 || dy == 0,\n      RuleShape.Forward => IsForwardOffset(team, dx, dy, distance),', '      RuleShape.Line or RuleShape.PierceStraight => dx == 0 || dy == 0,\n      RuleShape.Diagonal => Math.Abs(dx) == Math.Abs(dy),\n      RuleShape.LineOrDiagonal => dx == 0 || dy == 0 || Math.Abs(dx) == Math.Abs(dy),\n      RuleShape.ChessKnight => (Math.Abs(dx) == 1 && Math.Abs(dy) == 2) || (Math.Abs(dx) == 2 && Math.Abs(dy) == 1),\n      RuleShape.Forward => IsForwardOffset(team, dx, dy, distance),\n      RuleShape.ForwardLine => IsForwardOffset(team, dx, dy, distance),', 1)
          rules_path.write_text(u, encoding='utf-8')

      - name: Build production projects
        run: |
          dotnet build MedivalChess.Shared/MedivalChess.Shared.csproj --configuration Release
          dotnet build MedivalChess.csproj --configuration Release
          dotnet build MedivalChess.Server/MedivalChess.Server.csproj --configuration Release

      - name: Commit build fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MedivalChess.Shared/Piece.cs MedivalChess.Shared/CampaignUnitResolver.cs MedivalChess.Shared/UnitRules.cs
          git commit -m "fix: restore unit definition compatibility"
          git push origin HEAD:feature/new-unit-packs
