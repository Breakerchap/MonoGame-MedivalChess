name: CPU Guard improvement check

on:
  push:
    branches:
      - cpu-search-behaviour-fixes

permissions:
  contents: write

jobs:
  improve-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cpu-search-behaviour-fixes
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Apply Guard strategy improvements
        run: python tools/apply_guard_cpu_improvements.py
      - name: Restore
        run: dotnet restore CrownAndSiege.sln
      - name: Test
        run: dotnet test CrownAndSiege.sln --configuration Release --no-restore
      - name: Commit verified improvements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MedivalChess.CPU/CpuStrategicHeuristics.cs MedivalChess.CPU/CpuActionCandidates.cs
          git commit -m "Improve Guard CPU protection priorities"
          git push origin HEAD:cpu-search-behaviour-fixes
