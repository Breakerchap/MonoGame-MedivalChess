name: Myra refactor CI

on:
  push:
    branches: [feature/myra-ui-refactor]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || '' }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Apply Game1 integration
        run: python3 tools/apply_myra_refactor.py
      - name: Restore tools
        run: dotnet tool restore
      - name: Restore game
        run: dotnet restore MedivalChess.csproj
      - name: Restore tests
        run: dotnet restore MedivalChess.Tests/MedivalChess.Tests.csproj
      - name: Build game
        id: build_game
        run: dotnet build MedivalChess.csproj --configuration Release --no-restore
      - name: Test
        id: tests
        continue-on-error: true
        run: dotnet test MedivalChess.Tests/MedivalChess.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=myra-tests.trx" --results-directory TestResults
      - name: Commit integrated Game1
        if: steps.build_game.outcome == 'success' && github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Game1.cs
          if ! git diff --cached --quiet; then
            git commit -m "Integrate Myra UI into game loop"
            git push origin HEAD:feature/myra-ui-refactor
          fi
      - name: Report failed tests
        if: steps.tests.outcome == 'failure'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path('TestResults/myra-tests.trx')
          if not path.exists():
              print('::error title=Tests failed::dotnet test failed before producing a TRX result file.')
              raise SystemExit(1)

          root = ET.parse(path).getroot()
          namespace = root.tag.split('}')[0].strip('{') if root.tag.startswith('{') else ''
          prefix = f'{{{namespace}}}' if namespace else ''

          def escape(value: str) -> str:
              return (value or '').replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          failures = 0
          for result in root.iter(f'{prefix}UnitTestResult'):
              if result.attrib.get('outcome') != 'Failed':
                  continue
              failures += 1
              name = result.attrib.get('testName', 'Unknown test')
              output = result.find(f'{prefix}Output')
              error = output.find(f'{prefix}ErrorInfo') if output is not None else None
              message = error.findtext(f'{prefix}Message') if error is not None else 'Test failed.'
              stack = error.findtext(f'{prefix}StackTrace') if error is not None else ''
              details = message if not stack else f'{message}\n{stack}'
              print(f'::error title={escape(name)}::{escape(details)}')

          if failures == 0:
              print('::error title=Tests failed::dotnet test returned failure, but no failed test result was found in the TRX file.')
          raise SystemExit(1)
          PY
