name: CPU branch check

on:
  push:
    branches:
      - cpu-search-behaviour-fixes

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet restore CrownAndSiege.sln
      - run: dotnet test CrownAndSiege.sln --configuration Release --no-restore
